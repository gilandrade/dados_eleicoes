project:
  type: website
  output-dir: docs
  # Só estas páginas formam o site. As demais etapas (00b, 03 em diante) são
  # notebooks de execução local: `quarto render 03_pesos_alocacao.qmd -P ano:2026`.
  render:
    - index.qmd
    - 00_auxiliares.qmd
    - 01_locais_votacao.qmd
    - 02_geocodificacao_locais.qmd
    - mapas.qmd
  # docs/mapas/dados/ é gerado por 06_exporta_visualizador.qmd, fora do motor
  # do site. Isso NÃO impede que um `quarto render` do projeto inteiro limpe
  # docs/ — renderizar só os .qmd alterados (ver CLAUDE.md).
  resources:
    - assets/mapas.js
    - assets/mapas.css

website:
  title: "dados_eleicoes"
  navbar:
    left:
      - href: index.qmd
        text: Início
      - href: 00_auxiliares.qmd
        text: 00 · Auxiliares
      - href: 01_locais_votacao.qmd
        text: 01 · Locais de votação
      - href: 02_geocodificacao_locais.qmd
        text: 02 · Geocodificação
      - href: mapas.qmd
        text: Mapas

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    df-print: paged
